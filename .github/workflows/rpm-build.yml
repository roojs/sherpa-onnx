name: RPM packages

# Build libsherpa-onnx-c-api + -devel on Fedora (system onnxruntime-devel).
# Reuses debian/vendor-fetch.sh + debian/cmake overlays; rpmbuild is offline
# for those trees.

run-name: RPM packages · ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      refresh_cache:
        description: Rebuild debian/vendor download cache from scratch
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# One active build per ref (tag or branch). A later push/dispatch on the
# same tag waits (does not cancel the run that is already building).
concurrency:
  group: rpm-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-rpm:
    name: Build amd64 RPMs
    runs-on: ubuntu-24.04
    container:
      image: fedora:44

    env:
      RPM_VERSION: '1.13.4'

    defaults:
      run:
        shell: bash

    steps:
      - name: Install git and ca-certificates
        run: |
          set -euo pipefail
          dnf -y install ca-certificates git

      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore vendor cache
        id: restore-vendor
        uses: actions/cache/restore@v4
        with:
          path: debian/vendor
          key: vendor-v1-${{ inputs.refresh_cache && github.run_id || 'stable' }}-${{ hashFiles('debian/vendor-fetch.sh') }}
          restore-keys: |
            vendor-v1-stable-

      - name: Install build dependencies
        run: |
          set -euo pipefail
          dnf -y install \
            rpm-build \
            rpmdevtools \
            cmake \
            ninja-build \
            gcc-c++ \
            pkgconf-pkg-config \
            curl \
            unzip \
            ca-certificates \
            onnxruntime-devel \
            json-devel

      - name: Fetch vendor trees
        run: |
          set -euo pipefail
          if [ "${{ inputs.refresh_cache }}" = "true" ]; then
            rm -rf debian/vendor
          fi
          ./debian/vendor-fetch.sh

      - name: Save vendor cache
        if: always() && steps.restore-vendor.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: debian/vendor
          key: vendor-v1-stable-${{ hashFiles('debian/vendor-fetch.sh') }}

      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          # v1.13.4 → Version 1.13.4 / Release 1
          # v1.13.4-roojs1 → Version 1.13.4 / Release roojs1  (RPM forbids '-' in Version)
          tag="${GITHUB_REF_NAME#v}"
          if [[ "${tag}" =~ ^([0-9]+\.[0-9]+\.[0-9]+)(-([A-Za-z0-9.~+]+))?$ ]]; then
            ver="${BASH_REMATCH[1]}"
            rel="${BASH_REMATCH[3]:-1}"
          else
            ver="${tag}"
            rel="1"
          fi
          echo "RPM_VERSION=${ver}" >> "$GITHUB_ENV"
          echo "RPM_RELEASE=${rel}" >> "$GITHUB_ENV"
          sed -i "s/^Version:[[:space:]]*.*/Version:        ${ver}/" rpm/sherpa-onnx.spec
          sed -i "s/^Release:[[:space:]]*.*/Release:        ${rel}%{?dist}/" rpm/sherpa-onnx.spec
          grep -E '^(Version|Release):' rpm/sherpa-onnx.spec

      - name: Build RPMs
        run: |
          set -euo pipefail
          ver="${RPM_VERSION}"
          rel="${RPM_RELEASE:-1}"
          topdir="${PWD}/rpmbuild"
          mkdir -p "${topdir}"/{BUILD,RPMS,SOURCES,SPECS,SRPMS}

          tar \
            --exclude=.git \
            --exclude=build \
            --exclude=rpmbuild \
            --exclude=artifacts \
            --exclude='*.deb' \
            --exclude='*.rpm' \
            --exclude='*.ddeb' \
            -czf "${topdir}/SOURCES/sherpa-onnx-${ver}.tar.gz" \
            --transform "s,^,sherpa-onnx-${ver}/," \
            .

          cp rpm/sherpa-onnx.spec "${topdir}/SPECS/"
          sed -i "s/^Version:[[:space:]]*.*/Version:        ${ver}/" \
            "${topdir}/SPECS/sherpa-onnx.spec"
          sed -i "s/^Release:[[:space:]]*.*/Release:        ${rel}%{?dist}/" \
            "${topdir}/SPECS/sherpa-onnx.spec"

          rpmbuild -bb \
            --define "_topdir ${topdir}" \
            --define "_smp_ncpus_max 2" \
            "${topdir}/SPECS/sherpa-onnx.spec"

          mkdir -p artifacts
          find "${topdir}/RPMS" -type f -name '*.rpm' ! -name '*.src.rpm' \
            -exec cp -t artifacts {} +
          ls -lh artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libsherpa-onnx-c-api-rpms
          path: artifacts/*

      - name: Attach .rpms to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
