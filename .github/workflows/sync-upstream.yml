name: Sync upstream

# Keep origin/master aligned with k2-fsa/sherpa-onnx master.
# Packaging trees (debian/, rpm/) live only on this fork and should merge cleanly.
# Upstream workflow yaml is pruned after merge (fork keeps four jobs only).
# A README conflict is auto-resolved only when this fork's side is the upstream
# base plus the leading packaging banner. Any other content conflict fails the job.

run-name: Sync upstream · ${{ github.ref_name }}

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream/master
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch and merge upstream
        run: |
          set -euo pipefail
          upstream_url="https://github.com/k2-fsa/sherpa-onnx.git"
          git remote add upstream "${upstream_url}" 2>/dev/null \
            || git remote set-url upstream "${upstream_url}"
          git fetch upstream master
          git checkout master
          git pull --ff-only origin master

          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "Already up to date with upstream/master"
            exit 0
          fi

          set +e
          git merge upstream/master --no-edit
          merge_status=$?
          set -e

          if [[ "${merge_status}" -ne 0 ]]; then
            if ! ./.github/scripts/resolve-fork-merge-conflicts.sh; then
              git merge --abort || true
              exit 1
            fi
          fi

          # Drop upstream's hundreds of workflow yaml files; keep fork packaging/sync only.
          ./.github/scripts/prune-fork-workflows.sh

          if [[ "${merge_status}" -ne 0 ]]; then
            git commit --no-edit
          elif ! git diff --cached --quiet; then
            git commit --amend --no-edit
          fi

          git push origin master
          echo "Merged upstream/master into master"
