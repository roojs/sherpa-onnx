name: Sync upstream

# Keep origin/master aligned with k2-fsa/sherpa-onnx master.
# Packaging trees (debian/, rpm/) live only on this fork and should merge cleanly.

run-name: Sync upstream · ${{ github.ref_name }}

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream/master
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch and merge upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          upstream_url="https://github.com/k2-fsa/sherpa-onnx.git"
          git remote add upstream "${upstream_url}" 2>/dev/null \
            || git remote set-url upstream "${upstream_url}"
          git fetch upstream master
          git checkout master
          git pull --ff-only origin master

          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "Already up to date with upstream/master"
            exit 0
          fi

          if git merge upstream/master --no-edit; then
            # Upstream brings hundreds of workflow changes. GITHUB_TOKEN cannot
            # push those without workflows:write, and this fork only runs our own
            # packaging workflows — keep the pre-merge .github/workflows tree.
            git rm -rf --quiet .github/workflows
            git checkout HEAD^1 -- .github/workflows/
            if ! git diff --cached --quiet -- .github/workflows/; then
              git commit --amend --no-edit
            fi
            git push origin master
            echo "Merged upstream/master into master"
            exit 0
          fi

          git merge --abort || true
          gh issue create \
            --title "Upstream sync conflict $(date -u +%Y-%m-%d)" \
            --body "$(cat <<'EOF'
          Automated merge of `k2-fsa/sherpa-onnx` `master` into this fork failed.

          Resolve locally, keep `debian/` and `rpm/` intact, push to `master`, then re-run **Sync upstream**.
          EOF
          )" || true
          echo "Merge conflict — opened (or skipped) issue; failing the job" >&2
          exit 1
