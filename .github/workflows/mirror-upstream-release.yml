name: Mirror upstream v* release

# Poll k2-fsa/sherpa-onnx for new semver tags (vX.Y.Z). Ignore non-version
# "releases" such as xcframework / model dumps.
#
# When a new v* tag appears:
#   1. Merge that upstream release commit into our master (keeps debian/ + rpm/)
#      .github/workflows is fork-owned: never take upstream's tree (modify/delete
#      conflicts there are auto-resolved).
#   2. Create the same tag name on this fork (points at our packaged tree)
#   3. workflow_dispatch Debian + RPM builds
#      (GITHUB_TOKEN tag pushes do not trigger on.push workflows)
#   4. Those builds publish packages onto a GitHub Release for the tag

run-name: Mirror upstream release · ${{ github.ref_name }}

on:
  schedule:
    # Once a day (00:00 UTC). No-op runs still appear in Actions as green checks.
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: mirror-upstream-release
  cancel-in-progress: false

jobs:
  mirror:
    name: Detect and tag upstream v*
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Find newest upstream v* tag
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          upstream_url="https://github.com/k2-fsa/sherpa-onnx.git"

          latest="$(
            git ls-remote --tags --refs "${upstream_url}" 'refs/tags/v*' \
              | awk '{print $2}' \
              | sed 's|refs/tags/||' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V \
              | tail -n1
          )"
          if [ -z "${latest}" ]; then
            echo "No upstream vX.Y.Z tags found" >&2
            exit 1
          fi
          echo "Latest upstream semver tag: ${latest}"
          echo "tag=${latest}" >> "$GITHUB_OUTPUT"

          # Exact vX.Y.Z, or a packaging rebuild like vX.Y.Z-roojs1, means we
          # already handled this upstream release — exit green (no-op).
          if git ls-remote --tags origin "refs/tags/${latest}" | grep -q . \
            || git ls-remote --tags origin "refs/tags/${latest}-*" | grep -q .; then
            echo "Tag ${latest} (or ${latest}-*) already on origin — nothing to do"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag ${latest} is new for this fork"
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream release, push tag, dispatch builds
        if: steps.upstream.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail
          upstream_url="https://github.com/k2-fsa/sherpa-onnx.git"
          git remote add upstream "${upstream_url}" 2>/dev/null \
            || git remote set-url upstream "${upstream_url}"

          git checkout master
          git pull --ff-only origin master

          # Fetch release commit under a side ref so we do not clobber local tags.
          # Remote branch is "master", not "upstream/master".
          git fetch upstream \
            "refs/tags/${TAG}:refs/tags/upstream-${TAG}" \
            master:refs/remotes/upstream/master

          if ! git merge-base --is-ancestor "upstream-${TAG}" HEAD; then
            pre_merge=$(git rev-parse HEAD)

            set +e
            git merge "upstream-${TAG}" --no-edit \
              -m "Merge upstream ${TAG} for packaging"
            merge_status=$?
            set -e

            if [[ "${merge_status}" -ne 0 ]]; then
              mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
              non_wf=()
              for f in "${conflicts[@]+"${conflicts[@]}"}"; do
                case "${f}" in
                  .github/workflows/*) ;;
                  *) non_wf+=("${f}") ;;
                esac
              done
              if [[ ${#conflicts[@]} -eq 0 || ${#non_wf[@]} -gt 0 ]]; then
                echo "Merge conflict outside auto-resolve (only .github/workflows/* is auto-fixed):" >&2
                printf '  %s\n' "${conflicts[@]:-(none listed)}" >&2
                git merge --abort || true
                exit 1
              fi
              echo "Auto-resolving ${#conflicts[@]} workflow-only conflict(s)"
            fi

            # Upstream brings hundreds of workflow changes. GITHUB_TOKEN cannot
            # push those without workflows:write, and this fork only runs our own
            # packaging/sync workflows — always keep the pre-merge tree.
            git rm -rf --quiet .github/workflows
            git checkout "${pre_merge}" -- .github/workflows/

            if [[ "${merge_status}" -ne 0 ]]; then
              git commit --no-edit
            elif ! git diff --cached --quiet -- .github/workflows/; then
              git commit --amend --no-edit
            fi

            git push origin master
          fi

          git tag "${TAG}"
          git push origin "refs/tags/${TAG}"

          # Tag push with GITHUB_TOKEN does not start on.push workflows.
          gh workflow run debian-build.yml --ref "${TAG}"
          gh workflow run rpm-build.yml --ref "${TAG}"
          echo "Created ${TAG} and dispatched Debian + RPM builds"
