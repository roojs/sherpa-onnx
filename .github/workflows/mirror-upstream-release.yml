name: Mirror upstream v* release

# Poll k2-fsa/sherpa-onnx for new semver tags (vX.Y.Z). Ignore non-version
# "releases" such as xcframework / model dumps.
#
# When a new upstream vX.Y.Z appears and we have no vX.Y.Z-roojsN tag yet:
#   1. Merge that upstream release into master (keeps debian/ + rpm/)
#      .github/workflows is fork-owned: never take upstream's tree (modify/delete
#      conflicts there are auto-resolved).
#   2. Tag packaged master as vX.Y.Z-roojsN
#   3. Dispatch Debian + RPM builds (GITHUB_TOKEN tag pushes do not trigger on.push)
#
# workflow_dispatch re-dispatches builds for the latest -roojs tag (recovery after
# a partial run where the tag was pushed but builds were not started).

run-name: Mirror upstream release · ${{ github.ref_name }}

on:
  schedule:
    # Once a day (00:00 UTC). No-op runs still appear in Actions as green checks.
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: mirror-upstream-release
  cancel-in-progress: false

jobs:
  mirror:
    name: Detect and tag upstream v*
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Find newest upstream v* tag
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          upstream_url="https://github.com/k2-fsa/sherpa-onnx.git"

          latest="$(
            git ls-remote --tags --refs "${upstream_url}" 'refs/tags/v*' \
              | awk '{print $2}' \
              | sed 's|refs/tags/||' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V \
              | tail -n1
          )"
          if [ -z "${latest}" ]; then
            echo "No upstream vX.Y.Z tags found" >&2
            exit 1
          fi
          echo "Latest upstream semver tag: ${latest}"
          echo "tag=${latest}" >> "$GITHUB_OUTPUT"

          if git ls-remote --tags origin "refs/tags/${latest}-roojs*" | grep -q .; then
            echo "Packaging tag ${latest}-roojs* already on origin"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "No packaging tag for ${latest} yet"
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync upstream release and tag roojs
        if: steps.upstream.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail
          upstream_url="https://github.com/k2-fsa/sherpa-onnx.git"
          git remote add upstream "${upstream_url}" 2>/dev/null \
            || git remote set-url upstream "${upstream_url}"

          git checkout master
          git pull --ff-only origin master

          git fetch --no-tags upstream \
            "refs/tags/${TAG}:refs/tags/upstream-${TAG}" \
            master:refs/remotes/upstream/master

          if ! git merge-base --is-ancestor "upstream-${TAG}" HEAD; then
            pre_merge=$(git rev-parse HEAD)

            set +e
            git merge "upstream-${TAG}" --no-edit \
              -m "Merge upstream ${TAG} for packaging"
            merge_status=$?
            set -e

            if [[ "${merge_status}" -ne 0 ]]; then
              mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
              non_wf=()
              for f in "${conflicts[@]+"${conflicts[@]}"}"; do
                case "${f}" in
                  .github/workflows/*) ;;
                  *) non_wf+=("${f}") ;;
                esac
              done
              if [[ ${#conflicts[@]} -eq 0 || ${#non_wf[@]} -gt 0 ]]; then
                echo "Merge conflict outside auto-resolve (only .github/workflows/* is auto-fixed):" >&2
                printf '  %s\n' "${conflicts[@]:-(none listed)}" >&2
                git merge --abort || true
                exit 1
              fi
              echo "Auto-resolving ${#conflicts[@]} workflow-only conflict(s)"
            fi

            git rm -rf --quiet .github/workflows
            git checkout "${pre_merge}" -- .github/workflows/

            if [[ "${merge_status}" -ne 0 ]]; then
              git commit --no-edit
            elif ! git diff --cached --quiet -- .github/workflows/; then
              git commit --amend --no-edit
            fi

            git push origin master
          fi

          n=1
          while git ls-remote --tags origin "refs/tags/${TAG}-roojs${n}" | grep -q .; do
            n=$((n + 1))
          done
          release_tag="${TAG}-roojs${n}"

          git tag "${release_tag}"
          git push origin "refs/tags/${release_tag}"
          echo "Created ${release_tag}"

      - name: Dispatch packaging builds
        if: >-
          steps.upstream.outputs.new == 'true'
          || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail
          release_tag="$(
            git ls-remote --tags origin "refs/tags/${TAG}-roojs*" \
              | awk -F/ '{print $NF}' \
              | sort -V \
              | tail -n1
          )"
          if [ -z "${release_tag}" ]; then
            echo "No packaging tag for ${TAG} on origin" >&2
            exit 1
          fi
          echo "Dispatching Debian + RPM builds for ${release_tag}"
          gh workflow run debian-build.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "${release_tag}"
          gh workflow run rpm-build.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "${release_tag}"
