name: Sync upstream

# Keep origin/master aligned with k2-fsa/sherpa-onnx master.
# Packaging trees (debian/, rpm/) live only on this fork and should merge cleanly.
# .github/workflows is fork-owned: never take upstream's tree (modify/delete
# conflicts there are auto-resolved).

run-name: Sync upstream · ${{ github.ref_name }}

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream/master
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch and merge upstream
        run: |
          set -euo pipefail
          upstream_url="https://github.com/k2-fsa/sherpa-onnx.git"
          git remote add upstream "${upstream_url}" 2>/dev/null \
            || git remote set-url upstream "${upstream_url}"
          git fetch upstream master
          git checkout master
          git pull --ff-only origin master

          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "Already up to date with upstream/master"
            exit 0
          fi

          pre_merge=$(git rev-parse HEAD)

          set +e
          git merge upstream/master --no-edit
          merge_status=$?
          set -e

          if [[ "${merge_status}" -ne 0 ]]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            non_wf=()
            for f in "${conflicts[@]+"${conflicts[@]}"}"; do
              case "${f}" in
                .github/workflows/*) ;;
                *) non_wf+=("${f}") ;;
              esac
            done
            if [[ ${#conflicts[@]} -eq 0 || ${#non_wf[@]} -gt 0 ]]; then
              echo "Merge conflict outside auto-resolve (only .github/workflows/* is auto-fixed):" >&2
              printf '  %s\n' "${conflicts[@]:-(none listed)}" >&2
              git merge --abort || true
              exit 1
            fi
            echo "Auto-resolving ${#conflicts[@]} workflow-only conflict(s)"
          fi

          # Upstream brings hundreds of workflow changes. GITHUB_TOKEN cannot
          # push those without workflows:write, and this fork only runs our own
          # packaging/sync workflows — always keep the pre-merge tree.
          git rm -rf --quiet .github/workflows
          git checkout "${pre_merge}" -- .github/workflows/

          if [[ "${merge_status}" -ne 0 ]]; then
            git commit --no-edit
          elif ! git diff --cached --quiet -- .github/workflows/; then
            git commit --amend --no-edit
          fi

          git push origin master
          echo "Merged upstream/master into master"
