name: Mirror upstream v* release

# Poll k2-fsa/sherpa-onnx for new semver tags (vX.Y.Z). Ignore non-version
# "releases" such as xcframework / model dumps.
#
# When a new v* tag appears:
#   1. Merge that upstream release commit into our master (keeps debian/ + rpm/)
#   2. Create the same tag name on this fork (points at our packaged tree)
#   3. workflow_dispatch Debian + RPM builds
#      (GITHUB_TOKEN tag pushes do not trigger on.push workflows)
#   4. Those builds publish packages onto a GitHub Release for the tag

run-name: Mirror upstream release · ${{ github.ref_name }}

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: mirror-upstream-release
  cancel-in-progress: false

jobs:
  mirror:
    name: Detect and tag upstream v*
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Find newest upstream v* tag
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          upstream_url="https://github.com/k2-fsa/sherpa-onnx.git"

          latest="$(
            git ls-remote --tags --refs "${upstream_url}" 'refs/tags/v*' \
              | awk '{print $2}' \
              | sed 's|refs/tags/||' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V \
              | tail -n1
          )"
          if [ -z "${latest}" ]; then
            echo "No upstream vX.Y.Z tags found" >&2
            exit 1
          fi
          echo "Latest upstream semver tag: ${latest}"
          echo "tag=${latest}" >> "$GITHUB_OUTPUT"

          if git ls-remote --tags origin "refs/tags/${latest}" | grep -q .; then
            echo "Tag ${latest} already on origin — nothing to do"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag ${latest} is new for this fork"
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream release, push tag, dispatch builds
        if: steps.upstream.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail
          upstream_url="https://github.com/k2-fsa/sherpa-onnx.git"
          git remote add upstream "${upstream_url}" 2>/dev/null \
            || git remote set-url upstream "${upstream_url}"

          git checkout master
          git pull --ff-only origin master

          # Fetch release commit under a side ref so we do not clobber local tags.
          git fetch upstream "refs/tags/${TAG}:refs/tags/upstream-${TAG}" \
            upstream/master:refs/remotes/upstream/master

          if ! git merge-base --is-ancestor "upstream-${TAG}" HEAD; then
            git merge "upstream-${TAG}" --no-edit \
              -m "Merge upstream ${TAG} for packaging"
            git push origin master
          fi

          git tag "${TAG}"
          git push origin "refs/tags/${TAG}"

          # Tag push with GITHUB_TOKEN does not start on.push workflows.
          gh workflow run debian-build.yml --ref "${TAG}"
          gh workflow run rpm-build.yml --ref "${TAG}"
          echo "Created ${TAG} and dispatched Debian + RPM builds"
